<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030a16">
<title>Test de classe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#030a16;
  --cyan:#7fe7f2;
  --cyan-line:rgba(127,231,242,.38);
  --cyan-soft:rgba(127,231,242,.12);
  --orange:#FFAA71;
  --text:#e2fafd;
  --muted:#7ea6b4;
  --panel:rgba(6,24,42,.72);
  --cham:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:radial-gradient(ellipse at 50% 28%,#0b2445 0%,#061430 42%,#02060f 100%) fixed var(--bg);
  color:var(--text);
  font-family:'Rajdhani',system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
/* Scanlines */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:40;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.22) 2px 3px);
}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}

/* Grille holographique */
.bg-grid{
  position:fixed;left:-50%;right:-50%;bottom:-6%;height:62%;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(127,231,242,.10) 1px,transparent 1px),
    linear-gradient(90deg,rgba(127,231,242,.10) 1px,transparent 1px);
  background-size:46px 46px;
  transform:perspective(520px) rotateX(60deg);
  transform-origin:50% 100%;
  -webkit-mask-image:linear-gradient(to top,#000 0%,transparent 80%);
  mask-image:linear-gradient(to top,#000 0%,transparent 80%);
  animation:gridMove 9s linear infinite;
}
.bg-grid-flat{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(127,231,242,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(127,231,242,.035) 1px,transparent 1px);
  background-size:28px 28px;
}
@keyframes gridMove{to{background-position:0 46px,0 46px}}
.sweep{
  position:fixed;left:0;right:0;top:-140px;height:140px;z-index:1;pointer-events:none;
  background:linear-gradient(to bottom,transparent,rgba(127,231,242,.06),transparent);
  animation:sweep 7s linear infinite;
}
@keyframes sweep{to{transform:translateY(calc(100vh + 140px))}}
.corners i{
  position:fixed;width:22px;height:22px;z-index:3;pointer-events:none;
  border:1px solid var(--cyan-line);
}
.corners i:nth-child(1){top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;border-right:0;border-bottom:0}
.corners i:nth-child(2){top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;border-left:0;border-bottom:0}
.corners i:nth-child(3){bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:10px;border-right:0;border-top:0}
.corners i:nth-child(4){bottom:calc(env(safe-area-inset-bottom,0px) + 10px);right:10px;border-left:0;border-top:0}
.flash{
  position:fixed;inset:0;z-index:30;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 35%,rgba(127,231,242,.55),rgba(127,231,242,0) 65%);
}
.flash.go{animation:flash .8s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}

/* Structure */
.app{
  position:relative;z-index:2;
  max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;
  padding:calc(env(safe-area-inset-top,0px) + 30px) 24px calc(env(safe-area-inset-bottom,0px) + 22px);
  display:flex;flex-direction:column;
  overflow-x:clip;
}
.screen{flex:1;display:flex;flex-direction:column}
.screen[hidden]{display:none}

/* Boutons principaux */
.glow{filter:drop-shadow(0 0 14px rgba(127,231,242,.45))}
.cta{
  display:block;width:100%;min-height:60px;border:0;cursor:pointer;
  background:var(--cyan);color:#03121d;
  font:700 1.3rem/1 'Rajdhani',sans-serif;letter-spacing:.06em;
  padding:18px 24px;clip-path:var(--cham);
  transition:background .2s;
}
.cta:hover{background:#b4f4fa}
.cta:focus-visible{background:var(--orange);outline:none}

/* Démarrage */
#boot{justify-content:center}
.boot-log{font-size:.78rem;line-height:2;color:var(--muted);min-height:10em}
.boot-log .ln{opacity:0;animation:lnIn .25s forwards}
.boot-log .ok{color:var(--orange)}
.boot-log .cursor{display:inline-block;width:.6em;height:1em;background:var(--cyan);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes lnIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
.intro{margin-top:7vh;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .6s,transform .6s}
.intro.show{opacity:1;transform:none;pointer-events:auto}
.intro-kicker{color:var(--orange);font-size:.8rem;margin-bottom:12px}
.title{
  font-size:clamp(2.8rem,13vw,4.4rem);font-weight:700;line-height:.92;letter-spacing:.03em;
  color:var(--cyan);text-shadow:0 0 20px rgba(127,231,242,.5);
}
.lead{font-size:1.2rem;font-weight:500;line-height:1.35;opacity:.88;margin:18px 0 28px;max-width:30ch}
.field{display:block;margin-bottom:22px}
.field-label{display:block;font-size:.75rem;color:var(--orange);margin-bottom:8px}
.field-box{padding:1px;background:var(--cyan-line);clip-path:var(--cham)}
.field-box input{
  display:block;width:100%;min-height:56px;border:0;outline:none;
  padding:14px 18px;clip-path:var(--cham);
  background:rgba(5,20,36,.95);color:#f0fdff;
  font:600 1.25rem 'Rajdhani',sans-serif;letter-spacing:.02em;
}
.field-box input::placeholder{color:rgba(126,166,180,.6)}
.field-box:focus-within{background:var(--cyan)}
.field.error .field-box{background:var(--orange);animation:shake .35s}
.field-hint{min-height:1.2em;margin-top:6px;font-size:.72rem;color:var(--orange)}
.notice{font-size:.72rem;color:var(--muted);margin-top:14px;line-height:1.5}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

/* Quiz */
.hud-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.hud-label{font-size:.72rem;color:var(--muted)}
.counter{font-size:1.05rem;font-weight:500;color:var(--orange);text-shadow:0 0 10px rgba(255,170,113,.55)}
.bar{position:relative;height:4px;margin-top:10px;background:var(--cyan-soft)}
.bar::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 calc(100% / var(--n,16) - 2px),var(--bg) calc(100% / var(--n,16) - 2px) calc(100% / var(--n,16)));
}
.bar-fill{height:100%;width:0;background:var(--cyan);box-shadow:0 0 10px var(--cyan);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.bar-fill.bonus{background:var(--orange);box-shadow:0 0 10px var(--orange)}

.stage-wrap{position:relative;flex:1;display:flex}
.stage{flex:1;display:flex;flex-direction:column}
.question{
  font-size:clamp(1.6rem,6.6vw,2.15rem);font-weight:600;line-height:1.15;
  color:#f0fdff;text-shadow:0 0 14px rgba(127,231,242,.25);
  margin:7vh 0 28px;
}
.answers{display:flex;flex-direction:column;gap:12px}
.ans-wrap{transition:filter .2s}
.ans{
  display:block;width:100%;border:0;padding:1px;cursor:pointer;text-align:left;
  background:var(--cyan-line);clip-path:var(--cham);color:inherit;font:inherit;
  transition:background .15s;
}
.ans .in{
  display:flex;align-items:center;gap:14px;min-height:64px;padding:14px 18px;
  background:linear-gradient(100deg,rgba(9,34,56,.96),rgba(5,20,36,.94));
  clip-path:var(--cham);
  font-size:1.14rem;font-weight:500;line-height:1.25;color:var(--text);
  transition:background .15s;
}
.ans .pip{flex:none;width:9px;height:9px;border:1px solid var(--cyan);transform:rotate(45deg);transition:background .15s}
@media (hover:hover){
  .ans-wrap:hover{filter:drop-shadow(0 0 10px rgba(127,231,242,.45))}
  .ans:hover{background:var(--cyan)}
}
.ans:focus-visible{background:var(--orange);outline:none}
.ans-wrap.picked{filter:drop-shadow(0 0 16px rgba(127,231,242,.75))}
.ans.picked{background:var(--cyan)}
.ans.picked .in{background:linear-gradient(100deg,rgba(127,231,242,.34),rgba(127,231,242,.14));color:#fff}
.ans.picked .pip{background:var(--cyan)}

.stage.out{animation:glitchOut .24s steps(1) forwards}
.stage.in{animation:scanIn .42s ease-out forwards}
@keyframes glitchOut{
  0%{clip-path:inset(0);transform:none;opacity:1}
  20%{clip-path:inset(12% 0 52% 0);transform:translateX(-7px)}
  40%{clip-path:inset(58% 0 10% 0);transform:translateX(6px)}
  60%{clip-path:inset(30% 0 38% 0);transform:translateX(-3px);opacity:.7}
  80%{clip-path:inset(47% 0 47% 0);transform:scaleY(.9);opacity:.4}
  100%{clip-path:inset(50% 0 50% 0);opacity:0}
}
@keyframes scanIn{
  from{clip-path:inset(0 0 100% 0);opacity:.6;filter:brightness(1.7)}
  to{clip-path:inset(0 0 0 0);opacity:1;filter:none}
}
.scanbar{
  position:absolute;left:-12px;right:-12px;top:0;height:2px;opacity:0;pointer-events:none;
  background:var(--cyan);box-shadow:0 0 14px 2px var(--cyan);
}
.stage-wrap.scanning .scanbar{animation:scanBar .42s ease-out}
@keyframes scanBar{from{top:0;opacity:1}85%{opacity:.9}to{top:100%;opacity:0}}

.quiz-foot{padding-top:16px;min-height:48px}
.back{background:none;border:0;cursor:pointer;color:var(--muted);font-size:.78rem;padding:12px 2px}
.back:hover,.back:focus-visible{color:var(--cyan);outline:none}
.back[disabled]{visibility:hidden}

/* Analyse */
#analysis{justify-content:center;align-items:center;text-align:center}
.scan-ring{position:relative;width:min(62vw,240px);aspect-ratio:1;margin-bottom:28px}
.scan-ring svg{width:100%;height:100%;overflow:visible}
.scan-ring .track{fill:none;stroke:rgba(127,231,242,.15);stroke-width:2}
.scan-ring .prog{
  fill:none;stroke:var(--cyan);stroke-width:3;stroke-dasharray:100;stroke-dashoffset:100;
  transform:rotate(-90deg);transform-origin:100px 100px;filter:drop-shadow(0 0 6px var(--cyan));
}
.scan-ring .inner{fill:none;stroke:rgba(127,231,242,.4);stroke-width:1;stroke-dasharray:2 6;transform-origin:100px 100px;animation:spin 6s linear infinite}
.scan-ring .outer{fill:none;stroke:rgba(255,170,113,.45);stroke-width:1;stroke-dasharray:14 10;transform-origin:100px 100px;animation:spin 9s linear infinite reverse}
.pct{position:absolute;inset:0;display:grid;place-items:center;font-size:2.3rem;font-weight:500;color:var(--orange);text-shadow:0 0 14px rgba(255,170,113,.55)}
.analysis-title{font-size:1.55rem;font-weight:600;color:var(--cyan);text-shadow:0 0 12px rgba(127,231,242,.4)}
.analysis-step{margin-top:8px;min-height:1.3em;font-size:.78rem;color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}

/* Résultat */
#result{text-align:center}
.emblems{position:relative;display:flex;justify-content:center;gap:14px;margin-top:4vh}
.emblem{width:min(46vw,190px);height:auto;overflow:visible;position:relative;z-index:1}
.emblems.double .emblem{width:min(36vw,150px)}
.emblem .frame{fill:rgba(127,231,242,.07);stroke:var(--cyan);stroke-width:1.2;stroke-dasharray:1;stroke-dashoffset:1}
.emblem .ring{fill:none;stroke:rgba(255,170,113,.65);stroke-width:.8;stroke-dasharray:3 5;transform-origin:50px 50px}
.emblem .glyph{
  fill:none;stroke:var(--cyan);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 4px var(--cyan));
}
.play .emblem .frame{animation:draw .7s ease-out forwards}
.play .emblem .glyph{animation:draw 1.1s .35s ease-out forwards}
.play .emblem .ring{animation:spin 14s linear infinite}
@keyframes draw{to{stroke-dashoffset:0}}
.burst span{
  position:absolute;left:50%;top:50%;width:120px;height:120px;border-radius:50%;
  border:1.5px solid var(--cyan);opacity:0;transform:translate(-50%,-50%) scale(.2);pointer-events:none;
}
.play .burst span{animation:burst 1.4s ease-out forwards}
.play .burst span:nth-child(2){animation-delay:.18s;border-color:var(--orange)}
.play .burst span:nth-child(3){animation-delay:.36s}
@keyframes burst{
  0%{opacity:.95;transform:translate(-50%,-50%) scale(.2)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(3.4)}
}
.result-kicker{margin-top:26px;font-size:.8rem;color:var(--orange)}
.class-name{
  position:relative;margin-top:6px;
  font-size:clamp(2.5rem,12vw,4.2rem);font-weight:700;line-height:1;letter-spacing:.04em;
  color:var(--cyan);text-shadow:0 0 22px rgba(127,231,242,.6);
}
.class-name.multi{font-size:clamp(2rem,9vw,3.2rem)}
.class-name.glitch::before,.class-name.glitch::after{
  content:attr(data-text);position:absolute;inset:0;pointer-events:none;
}
.class-name.glitch::before{color:var(--orange);animation:glitchA .9s steps(2) forwards}
.class-name.glitch::after{color:#fff;animation:glitchB .9s steps(2) forwards}
@keyframes glitchA{
  0%{transform:translate(-4px,1px);clip-path:inset(0 0 60% 0);opacity:.9}
  30%{transform:translate(3px,-1px);clip-path:inset(40% 0 20% 0)}
  60%{transform:translate(-2px,0);clip-path:inset(70% 0 0 0)}
  100%{transform:none;opacity:0}
}
@keyframes glitchB{
  0%{transform:translate(4px,-1px);clip-path:inset(55% 0 10% 0);opacity:.7}
  40%{transform:translate(-3px,1px);clip-path:inset(10% 0 65% 0)}
  70%{transform:translate(2px,0);clip-path:inset(30% 0 45% 0)}
  100%{transform:none;opacity:0}
}
.result-text{
  margin:26px 0 30px;padding:18px 20px;text-align:left;
  background:var(--panel);border:1px solid rgba(127,231,242,.25);
  border-left:2px solid var(--cyan);
}
.result-text p{font-size:1.15rem;font-weight:500;line-height:1.45;opacity:.94}
.result-text p + p,.result-text p + h3{margin-top:14px}
.result-text h3{font-size:1.25rem;font-weight:700;color:var(--cyan);margin-bottom:4px}
.rv{opacity:0;transform:translateY(8px)}
.play .rv{animation:rv .6s ease-out forwards;animation-delay:var(--d,0s)}
@keyframes rv{to{opacity:1;transform:none}}
#restartBtn{margin-top:auto}
.send-status{font-size:.72rem;color:var(--muted);margin:-14px 0 22px;min-height:1.2em}

@media (min-width:700px){
  .app{padding-top:60px}
  .question{margin-top:9vh}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;animation-delay:0s !important;transition-duration:.01ms !important}
  .sweep{display:none}
}
</style>
</head>
<body>
<div class="bg-grid-flat" aria-hidden="true"></div>
<div class="bg-grid" aria-hidden="true"></div>
<div class="sweep" aria-hidden="true"></div>
<div class="corners" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="flash" id="flash" aria-hidden="true"></div>

<main class="app">
  <section id="boot" class="screen">
    <div class="boot-log mono" id="bootLog" aria-hidden="true"></div>
    <div class="intro" id="intro">
      <p class="intro-kicker mono" id="introKicker"></p>
      <h1 class="title" id="introTitle"></h1>
      <p class="lead" id="introText"></p>
      <label class="field" id="nameField">
        <span class="field-label mono" id="nameLabel"></span>
        <span class="field-box" style="display:block"><input id="nameInput" type="text" maxlength="40" autocomplete="name" enterkeyhint="go"></span>
        <span class="field-hint mono" id="nameHint" aria-live="polite"></span>
      </label>
      <div class="glow"><button class="cta" id="startBtn" type="button"></button></div>
      <p class="notice mono" id="sendNotice"></p>
    </div>
  </section>

  <section id="quiz" class="screen" hidden>
    <header class="hud">
      <div class="hud-row">
        <span class="hud-label mono" id="hudLabel"></span>
        <span class="counter mono" id="counter" aria-live="polite"></span>
      </div>
      <div class="bar" id="bar"><div class="bar-fill" id="barFill"></div></div>
    </header>
    <div class="stage-wrap" id="stageWrap">
      <div class="stage" id="stage">
        <h2 class="question" id="question"></h2>
        <div class="answers" id="answers"></div>
      </div>
      <div class="scanbar" aria-hidden="true"></div>
    </div>
    <footer class="quiz-foot">
      <button class="back mono" id="backBtn" type="button"></button>
    </footer>
  </section>

  <section id="analysis" class="screen" hidden>
    <div class="scan-ring">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle class="outer" cx="100" cy="100" r="96"/>
        <circle class="track" cx="100" cy="100" r="84"/>
        <circle class="prog" id="ringProg" cx="100" cy="100" r="84" pathLength="100"/>
        <circle class="inner" cx="100" cy="100" r="66"/>
      </svg>
      <div class="pct mono" id="pct">0 %</div>
    </div>
    <p class="analysis-title" id="analysisTitle"></p>
    <p class="analysis-step mono" id="analysisStep"></p>
  </section>

  <section id="result" class="screen" hidden>
    <div class="emblems" id="emblems"></div>
    <p class="result-kicker mono rv" id="resultKicker" style="--d:.9s"></p>
    <h1 class="class-name rv" id="className" style="--d:1s"></h1>
    <div class="result-text rv" id="resultText" style="--d:1.9s"></div>
    <p class="send-status mono rv" id="sendStatus" style="--d:2.1s"></p>
    <div class="glow rv" style="--d:2.3s"><button class="cta" id="restartBtn" type="button"></button></div>
  </section>
</main>

<script>
/* ==========================================================================
   DONNÉES DU TEST — tout le contenu modifiable est ici.
   - classes : nom, texte de résultat, dessin de l'emblème (tracé SVG 100×100)
   - questions : texte + réponses ; chaque réponse donne "main" (points.main)
     et, si présent, "secondary" (points.secondary). Utiliser les identifiants
     des classes (duelliste, gardien, ...).
   - bonus : question de départage, une réponse par classe.
   - ui : tous les textes de l'interface.
   ========================================================================== */
const TEST = {
  // Envoi des résultats : colle ici l'adresse de ton Google Apps Script
  // (elle se termine par /exec). Laisse "" pour ne rien envoyer.
  send: { url: "https://script.google.com/macros/s/AKfycbzDjyaLC6PeAiuoNzFTdOur_c_06Y5i2Wh49BTtedH6WOhEUCExEjGiGpE6_wuRH9PxZg/exec" },

  points: { main: 2, secondary: 1 },
  doubleClass: { maxGap: 1, minScore: 12 },

  classes: {
    duelliste: {
      name: "Duelliste",
      text: "Toi, tu ne tournes pas autour du pot : tu vises, tu frappes, c'est réglé. Quand tu commences quelque chose, tu le finis, et souvent avant tout le monde. En combat, tu es celui ou celle qu'on envoie quand il faut faire tomber LA cible qui compte.",
      glyph: "M50 12 L50 68 M44 22 L50 12 L56 22 M36 68 L64 68 M50 68 L50 88"
    },
    gardien: {
      name: "Gardien",
      text: "Tu es le mur sur lequel l'équipe peut s'appuyer. Patient, fiable, tu te places devant sans faire de bruit, et les autres osent tout parce qu'ils savent que tu tiens. En combat, tant que tu es debout, personne ne touche à tes alliés.",
      glyph: "M50 16 L78 26 L75 54 Q70 74 50 86 Q30 74 25 54 L22 26 Z M50 30 L50 72"
    },
    soigneur: {
      name: "Soigneur",
      text: "Tu repères le collègue qui fatigue avant même qu'il le sache. Ton super-pouvoir, c'est l'attention : un mot, un geste, et l'équipe repart. En combat, c'est grâce à toi que tout le monde est encore là au dernier round.",
      glyph: "M43 20 H57 V43 H80 V57 H57 V80 H43 V57 H20 V43 H43 Z"
    },
    saboteur: {
      name: "Saboteur",
      text: "Les règles ? Tu les connais très bien, surtout leurs failles. Tu as toujours un coup d'avance et un plan B que personne n'a vu venir. En combat, l'adversaire ralentit, trébuche, se perd… et ne comprend jamais vraiment pourquoi.",
      glyph: "M57 12 L31 54 H50 L42 88 L71 42 H52 Z"
    },
    tireur: {
      name: "Tireur",
      text: "Toi, c'est l'action, et en grand ! Tu préfères mettre de l'énergie partout plutôt qu'attendre le moment parfait. En combat, tu arroses toute l'équipe adverse d'un coup, et ça fait du dégât.",
      glyph: "M50 40 L50 14 M58 45 L81 32 M58 55 L81 68 M50 60 L50 86 M42 55 L19 68 M42 45 L19 32 M44 50 A6 6 0 1 0 56 50 A6 6 0 1 0 44 50"
    },
    mystique: {

/* ==========================================================================
   MOTEUR — pas besoin de modifier ce qui suit.
   ========================================================================== */
(() => {
  const $ = id => document.getElementById(id);
  const RM = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const wait = ms => new Promise(r => setTimeout(r, RM ? Math.min(ms, 40) : ms));
  const pad = n => String(n).padStart(2, "0");
  const shuffle = arr => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  const CLASS_IDS = Object.keys(TEST.classes);
  const N = TEST.questions.length;
  const U = TEST.ui;

  const state = { name: "", mode: "quiz", idx: 0, answers: [], orders: [], bonusOrder: [], locked: false };

  /* ---------- textes fixes ---------- */
  $("introKicker").textContent = U.introKicker;
  $("introTitle").textContent = U.introTitle;
  $("introText").textContent = U.introText;
  $("startBtn").textContent = U.startLabel;
  $("nameLabel").textContent = U.nameLabel;
  $("nameInput").placeholder = U.namePlaceholder;
  const SEND_ON = !!TEST.send.url;
  $("sendNotice").textContent = SEND_ON ? U.sendNotice : "";
  $("backBtn").textContent = U.backLabel;
  $("analysisTitle").textContent = U.analysisTitle;
  $("restartBtn").textContent = U.restartLabel;
  $("bar").style.setProperty("--n", N);

  const show = id => {
    document.querySelectorAll(".screen").forEach(s => { s.hidden = s.id !== id; });
    window.scrollTo(0, 0);
  };

  /* ---------- démarrage ---------- */
  let bootSkipped = false;
  async function boot() {
    const log = $("bootLog");
    log.innerHTML = "";
    for (const line of U.bootLines) {
      if (bootSkipped) break;
      const div = document.createElement("div");
      div.className = "ln";
      div.textContent = line.text + " ";
      log.appendChild(div);
      await wait(260);
      if (line.ok) {
        const ok = document.createElement("span");
        ok.className = "ok";
        ok.textContent = "[" + line.ok + "]";
        div.appendChild(ok);
        await wait(120);
      }
    }
    if (!bootSkipped) {
      const c = document.createElement("span");
      c.className = "cursor";
      log.lastChild && log.lastChild.appendChild(c);
    }
    await wait(250);
    $("intro").classList.add("show");
  }
  $("boot").addEventListener("pointerdown", () => {
    if (!$("intro").classList.contains("show")) bootSkipped = true;
  });

  /* ---------- nom ---------- */
  function begin() {
    const input = $("nameInput"), field = $("nameField");
    const name = input.value.trim().replace(/\s+/g, " ");
    if (!name) {
      field.classList.remove("error");
      void field.offsetWidth;
      field.classList.add("error");
      $("nameHint").textContent = U.nameMissing;
      input.focus();
      return;
    }
    field.classList.remove("error");
    $("nameHint").textContent = "";
    state.name = name;
    input.blur();
    start();
  }
  $("nameInput").addEventListener("keydown", e => { if (e.key === "Enter") begin(); });

  /* ---------- quiz ---------- */
  function start() {
    state.mode = "quiz";
    state.idx = 0;
    state.answers = [];
    state.orders = TEST.questions.map(q => shuffle(q.answers.map((_, i) => i)));
    state.bonusOrder = [];
    state.locked = false;
    $("result").classList.remove("play");
    renderQuestion();
    show("quiz");
  }

  function renderQuestion() {
    const fill = $("barFill");
    let text, options;
    if (state.mode === "bonus") {
      text = TEST.bonus.text;
      options = state.bonusOrder.map(i => ({ i, text: TEST.bonus.answers[i].text }));
      $("counter").textContent = U.bonusLabel;
      $("hudLabel").textContent = U.bonusHint;
      fill.style.width = "100%";
      fill.classList.add("bonus");
      $("backBtn").disabled = false;
    } else {
      const q = TEST.questions[state.idx];
      text = q.text;
      options = state.orders[state.idx].map(i => ({ i, text: q.answers[i].text }));
      $("counter").textContent = pad(state.idx + 1) + " / " + pad(N);
      $("hudLabel").textContent = U.hudLabel;
      fill.style.width = (state.idx / N * 100) + "%";
      fill.classList.remove("bonus");
      $("backBtn").disabled = state.idx === 0;
    }
    $("question").textContent = text;
    const box = $("answers");
    box.innerHTML = "";
    options.forEach(o => {
      const wrap = document.createElement("div");
      wrap.className = "ans-wrap";
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "ans";
      const inner = document.createElement("span");
      inner.className = "in";
      const pip = document.createElement("span");
      pip.className = "pip";
      const label = document.createElement("span");
      label.textContent = o.text;
      inner.append(pip, label);
      btn.appendChild(inner);
      btn.addEventListener("click", () => pick(o.i, wrap, btn));
      wrap.appendChild(btn);
      box.appendChild(wrap);
    });
  }

  async function swap(render) {
    const stage = $("stage"), wrap = $("stageWrap");
    stage.classList.add("out");
    await wait(240);
    render();
    stage.classList.remove("out");
    void stage.offsetWidth;
    stage.classList.add("in");
    wrap.classList.add("scanning");
    await wait(430);
    stage.classList.remove("in");
    wrap.classList.remove("scanning");
  }

  async function pick(i, wrap, btn) {
    if (state.locked) return;
    state.locked = true;
    btn.classList.add("picked");
    wrap.classList.add("picked");
    await wait(170);

    if (state.mode === "bonus") {
      finish(TEST.bonus.answers[i].class);
      return;
    }

    state.answers[state.idx] = i;
    state.idx++;
    if (state.idx < N) {
      await swap(renderQuestion);
      state.locked = false;
      return;
    }

    $("barFill").style.width = "100%";
    const tied = topClasses();
    if (tied.length === 1) { finish(tied[0]); return; }

    const order = shuffle(
      TEST.bonus.answers.map((_, k) => k).filter(k => tied.includes(TEST.bonus.answers[k].class))
    );
    if (order.length < 2) {
      finish(order.length ? TEST.bonus.answers[order[0]].class : tied[Math.floor(Math.random() * tied.length)]);
      return;
    }
    state.mode = "bonus";
    state.bonusOrder = order;
    await swap(renderQuestion);
    state.locked = false;
  }

  async function back() {
    if (state.locked) return;
    if (state.mode === "bonus") {
      state.mode = "quiz";
      state.idx = N - 1;
      state.answers.length = N - 1;
    } else if (state.idx > 0) {
      state.idx--;
      state.answers.length = state.idx;
    } else {
      return;
    }
    state.locked = true;
    await swap(renderQuestion);
    state.locked = false;
  }

  /* ---------- calcul (jamais affiché) ---------- */
  function computeScores() {
    const score = {}, mains = {};
    CLASS_IDS.forEach(c => { score[c] = 0; mains[c] = 0; });
    state.answers.forEach((ai, qi) => {
      const a = TEST.questions[qi].answers[ai];
      if (a.main in score) { score[a.main] += TEST.points.main; mains[a.main]++; }
      if (a.secondary && a.secondary in score) score[a.secondary] += TEST.points.secondary;
    });
    return { score, mains };
  }

  // Règle d'égalité : 1) plus de points ; 2) plus de choix en principal ; 3) question bonus.
  function topClasses() {
    const { score, mains } = computeScores();
    const max = Math.max(...CLASS_IDS.map(c => score[c]));
    let tied = CLASS_IDS.filter(c => score[c] === max);
    if (tied.length > 1) {
      const mm = Math.max(...tied.map(c => mains[c]));
      tied = tied.filter(c => mains[c] === mm);
    }
    return tied;
  }

  async function finish(winner) {
    state.locked = true;
    const { score, mains } = computeScores();
    const second = CLASS_IDS
      .filter(c => c !== winner)
      .sort((a, b) => (score[b] - score[a]) || (mains[b] - mains[a]))[0];
    const dc = TEST.doubleClass;
    const isDouble = second &&
      score[winner] - score[second] <= dc.maxGap &&
      score[winner] >= dc.minScore &&
      score[second] >= dc.minScore;

    const C = TEST.classes;
    const scores = {};
    CLASS_IDS.forEach(c => { scores[C[c].name] = score[c]; });
    const payload = {
      nom: state.name,
      classe: C[winner].name,
      doubleClasse: isDouble ? C[second].name : "",
      scores,
      reponses: state.answers.map((a, qi) => (qi + 1) + "ABCD"[a]).join(" ") +
        (state.mode === "bonus" ? " | bonus : " + C[winner].name : "")
    };

    show("analysis");
    await runAnalysis();
    show("result");
    reveal(winner, isDouble ? second : null);
    sendResult(payload);
  }

  /* ---------- envoi ---------- */
  async function sendResult(payload) {
    const el = $("sendStatus");
    if (!SEND_ON) { el.textContent = ""; return; }
    el.textContent = U.sending;
    try {
      await fetch(TEST.send.url, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      el.textContent = U.sent;
    } catch (e) {
      el.textContent = U.sendError;
    }
  }

  /* ---------- analyse ---------- */
  function runAnalysis() {
    const ring = $("ringProg"), pct = $("pct"), step = $("analysisStep");
    const steps = U.analysisSteps;
    const dur = RM ? 300 : 3200;
    ring.style.strokeDashoffset = 100;
    pct.textContent = "0 %";
    return new Promise(res => {
      const t0 = performance.now();
      const frame = now => {
        const p = Math.min(1, (now - t0) / dur);
        const e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
        const v = Math.round(e * 100);
        pct.textContent = v + " %";
        ring.style.strokeDashoffset = 100 - v;
        step.textContent = steps[Math.min(steps.length - 1, Math.floor(p * steps.length))];
        if (p < 1) requestAnimationFrame(frame);
        else setTimeout(res, RM ? 40 : 380);
      };
      requestAnimationFrame(frame);
    });
  }

  /* ---------- révélation ---------- */
  const NS = "http://www.w3.org/2000/svg";
  function emblem(id) {
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 100 100");
    svg.setAttribute("class", "emblem");
    svg.setAttribute("aria-hidden", "true");
    const frame = document.createElementNS(NS, "polygon");
    frame.setAttribute("class", "frame");
    frame.setAttribute("pathLength", "1");
    frame.setAttribute("points", "50,4 89.8,27 89.8,73 50,96 10.2,73 10.2,27");
    const ring = document.createElementNS(NS, "circle");
    ring.setAttribute("class", "ring");
    ring.setAttribute("cx", "50"); ring.setAttribute("cy", "50"); ring.setAttribute("r", "40");
    const glyph = document.createElementNS(NS, "path");
    glyph.setAttribute("class", "glyph");
    glyph.setAttribute("pathLength", "1");
    glyph.setAttribute("d", TEST.classes[id].glyph || "");
    svg.append(frame, ring, glyph);
    return svg;
  }

  function scramble(el, str) {
    const chars = "░▒▓<>/\\#*+=ΞΔ01";
    const dur = RM ? 0 : 750;
    const t0 = performance.now();
    el.classList.remove("glitch");
    return new Promise(res => {
      const frame = now => {
        const p = dur ? Math.min(1, (now - t0) / dur) : 1;
        const n = Math.floor(p * str.length);
        let out = str.slice(0, n);
        for (let k = n; k < str.length; k++) {
          const ch = str[k];
          out += (ch === " " || ch === "/") ? ch : chars[Math.floor(Math.random() * chars.length)];
        }
        el.textContent = out;
        if (p < 1) requestAnimationFrame(frame);
        else {
          el.textContent = str;
          el.dataset.text = str;
          el.classList.add("glitch");
          setTimeout(() => el.classList.remove("glitch"), 1000);
          res();
        }
      };
      requestAnimationFrame(frame);
    });
  }

  function reveal(winner, second) {
    const C = TEST.classes;
    const section = $("result");
    section.classList.remove("play");

    const box = $("emblems");
    box.innerHTML = "";
    box.classList.toggle("double", !!second);
    const burst = document.createElement("div");
    burst.className = "burst";
    burst.setAttribute("aria-hidden", "true");
    burst.append(document.createElement("span"), document.createElement("span"), document.createElement("span"));
    box.appendChild(burst);
    [winner, second].filter(Boolean).forEach(id => box.appendChild(emblem(id)));

    $("resultKicker").textContent = (second ? U.doubleKicker : U.resultKicker).replace("{nom}", state.name);
    const nameStr = second ? C[winner].name + " / " + C[second].name : C[winner].name;
    const nameEl = $("className");
    nameEl.classList.toggle("multi", !!second);
    nameEl.textContent = nameStr;

    const txt = $("resultText");
    txt.innerHTML = "";
    if (second) {
      const intro = document.createElement("p");
      intro.textContent = U.doubleIntro;
      txt.appendChild(intro);
      [winner, second].forEach(id => {
        const h = document.createElement("h3");
        h.textContent = C[id].name;
        const p = document.createElement("p");
        p.textContent = C[id].text;
        txt.append(h, p);
      });
    } else {
      const p = document.createElement("p");
      p.textContent = C[winner].text;
      txt.appendChild(p);
    }

    void section.offsetWidth;
    section.classList.add("play");
    const flash = $("flash");
    flash.classList.remove("go");
    void flash.offsetWidth;
    flash.classList.add("go");
    setTimeout(() => scramble(nameEl, nameStr), RM ? 0 : 1000);
  }

  /* ---------- événements ---------- */
  $("startBtn").addEventListener("click", begin);
  $("restartBtn").addEventListener("click", start);
  $("backBtn").addEventListener("click", back);

  boot();
})();
</script>
