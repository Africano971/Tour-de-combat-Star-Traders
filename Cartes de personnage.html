<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartes de personnage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:ital,wght@0,500;0,600;0,800;1,800&display=swap" rel="stylesheet">
<style>
:root{ --bg:#08080c; --text:#ece8f2; --dim:#9a97ab; --line:#2a2a3a; --c:#F72B2B; --cl:#FF8888; color-scheme:dark; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#08080c; --text:#ece8f2; } }
:root[data-theme="dark"]{ --bg:#08080c; --text:#ece8f2; }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:"Rajdhani",system-ui,sans-serif; font-weight:500;
  background-image:radial-gradient(ellipse 60% 42% at 50% 40%, color-mix(in srgb, var(--c) 22%, #000) 0%, var(--bg) 72%);
  transition:background-color .4s;
  display:flex; flex-direction:column; align-items:center; min-height:100dvh;
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(22px + env(safe-area-inset-bottom,0px)); overflow-x:hidden;
}
.switch{display:flex; gap:4px; background:#12121b; border:1px solid var(--line); border-radius:10px; padding:3px; margin-bottom:18px}
.switch button{background:none; border:0; border-radius:7px; padding:7px 14px; font-weight:600; color:var(--dim); display:flex; align-items:center; gap:7px}
.switch button.on{background:#232333; color:var(--text)}
.switch .dot{width:9px; height:9px; border-radius:50%; background:var(--d)}
.stage{
  width:min(80vw, 360px, calc((100dvh - 290px) * 0.706)); aspect-ratio:226/320; perspective:1000px; touch-action:none;
  cursor:grab; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; position:relative; flex:none;
}
.shadow{position:absolute; left:14%; right:14%; bottom:2%; height:8%; background:radial-gradient(ellipse at center, color-mix(in srgb, var(--c) 45%, transparent), transparent 70%); filter:blur(14px); transform:translateY(40%); pointer-events:none}
.tilt{width:100%; height:100%; transform-style:preserve-3d; will-change:transform}
.tilt svg{width:100%; height:100%; display:block; overflow:visible}
.beam{position:absolute; left:4%; right:4%; height:2px; top:0; opacity:0; pointer-events:none;
  background:linear-gradient(90deg, transparent, #fff 20%, var(--cl) 50%, #fff 80%, transparent);
  box-shadow:0 0 12px 3px color-mix(in srgb, var(--c) 80%, transparent), 0 0 30px 8px color-mix(in srgb, var(--c) 35%, transparent)}
.booting .tilt{animation:reveal 1s cubic-bezier(.5,0,.3,1) both}
.booting .beam{animation:beam 1s cubic-bezier(.5,0,.3,1) both}
@keyframes reveal{0%{clip-path:inset(0 0 100% 0); opacity:0} 6%{opacity:1} 9%{opacity:.3} 12%{opacity:1} 100%{clip-path:inset(0 0 0 0); opacity:1}}
@keyframes beam{0%{top:3%;opacity:1} 92%{top:97%;opacity:1} 100%{top:97%;opacity:0}}

.controls{margin-top:22px; display:flex; flex-direction:column; align-items:center; gap:10px; width:100%; max-width:420px}
.row{display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%}
button{font:inherit; color:var(--text); cursor:pointer; -webkit-tap-highlight-color:transparent}
.act{font-weight:600; font-size:1rem; background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:8px; padding:9px 10px}
.act:hover{border-color:var(--cl)}
.act:disabled{opacity:.35; cursor:default}
.act.dmg{color:#ffb3b3} .act.heal{color:#a9f5c8} .act.xp{color:#b6f0b9} .act.star{color:#ffe7a8} .act.shield{color:#ffffff}
.act.wide{grid-column:1 / -1}
#shieldBar{transition:opacity .2s}
.shieldUp #shieldBar{animation:shieldUp .6s ease-out}
@keyframes shieldUp{0%{filter:brightness(1)} 30%{filter:brightness(1.6) drop-shadow(0 0 2px #fff)} 100%{filter:brightness(1)}}
.shieldBreak #shieldShards{animation:shards .6s ease-out}
#shieldShards{opacity:0}
@keyframes shards{0%{opacity:1; transform:scaleY(1)} 100%{opacity:0; transform:scaleY(3)}}
.ghost{background:none; border:0; color:var(--dim); font-weight:600; text-decoration:underline; text-underline-offset:3px}
button:focus-visible{outline:2px solid var(--cl); outline-offset:2px}
.status{min-height:1.4em; margin:0; color:var(--dim); text-align:center; font-size:.98rem}
.status b{color:var(--text)}

/* ---- animations internes à la carte ---- */
.card{--tx:0; --ty:0}
#Personnage{transform:translate(calc(var(--tx) * 4px), calc(var(--ty) * 3px))}
.mystique #persoFloat{animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)} 50%{transform:translateY(-4.5px)}}
.gardien #persoFloat{transform-box:fill-box; transform-origin:50% 100%; animation:breath 4.5s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(1)} 50%{transform:scale(1.012)}}
#glint{animation:glint 5s ease-in-out infinite}
@keyframes glint{0%,40%{transform:skewX(-18deg) translateX(0)} 75%,100%{transform:skewX(-18deg) translateX(330px)}}
#aura{transform-box:fill-box; transform-origin:center; animation:aura 3.2s ease-in-out infinite}
@keyframes aura{0%,100%{opacity:.55; transform:scale(.96)} 50%{opacity:1; transform:scale(1.04)}}
.ring{transform-box:fill-box; transform-origin:center; opacity:0; animation:ring 3.2s ease-out infinite}
.ring.r2{animation-delay:1.6s}
@keyframes ring{0%{transform:scale(1); opacity:0} 12%{opacity:.85} 100%{transform:scale(1.75); opacity:0}}
#crystalGroup{transform:translate(calc(var(--tx) * 2.5px), calc(var(--ty) * 2px))}
#crystalCore{transform-box:fill-box; transform-origin:center; animation:core 2.6s ease-in-out infinite}
@keyframes core{0%,100%{opacity:.35} 50%{opacity:.95}}
#Cristal{filter:drop-shadow(0 0 1.2px #9db4ff)}
.cline{stroke-dasharray:1; stroke-dashoffset:0}
#glowFrameA,#glowFrameB{animation:breathe 4s ease-in-out infinite}
#bannerGlowA,#bannerGlowB,#bannerGlowC{animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1} 50%{opacity:.55}}
#circuitL,#circuitR{animation:flicker 5s steps(1) infinite}
#circuitR{animation-delay:-2.3s}
@keyframes flicker{0%,100%{opacity:1} 41%{opacity:.35} 43%{opacity:1} 45%{opacity:.5} 47%{opacity:1}}
#sparkL,#sparkR{animation:twinkle 2.4s ease-in-out infinite}
#sparkR{animation-delay:-1.2s}
@keyframes twinkle{0%,100%{opacity:1} 50%{opacity:.25}}
#scanBand{animation:scan 6s cubic-bezier(.4,0,.6,1) infinite}
@keyframes scan{0%{transform:translateY(0)} 55%,100%{transform:translateY(400px)}}
#barSheen{animation:sheen 3.6s ease-in-out infinite}
@keyframes sheen{0%,30%{transform:translateX(0)} 75%,100%{transform:translateX(180px)}}
#fxFoil{mix-blend-mode:screen; opacity:.55}
#tRarity{animation:rarity 4s ease-in-out infinite}
@keyframes rarity{0%,80%,100%{opacity:.69} 88%{opacity:1}}
[id^="star"]{transform-box:fill-box; transform-origin:center; transition:opacity .3s}
.starPop{animation:starPop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes starPop{0%{transform:scale(0); opacity:0} 60%{transform:scale(1.7); opacity:1} 100%{transform:scale(1)}}
#Niveaux, #lvlFlash{transform-box:fill-box; transform-origin:center}
.lvlUp #Niveaux{animation:lvlUp .7s ease-out}
@keyframes lvlUp{0%{transform:scale(1)} 30%{transform:scale(1.5); filter:brightness(2)} 100%{transform:scale(1)}}
.lvlUp #Expérience{animation:xpFlash .7s ease-out}
@keyframes xpFlash{0%,100%{filter:none} 30%{filter:brightness(2.2) drop-shadow(0 0 3px #9dffa4)}}

/* pulsion au toucher */
.burst #persoImg{animation:flash .9s ease-out}
@keyframes flash{0%{filter:brightness(1)} 15%{filter:brightness(1.6) saturate(1.3)} 100%{filter:brightness(1)}}
#shock{transform-box:fill-box; transform-origin:center; opacity:0}
.burst #shock{animation:shock .9s ease-out}
@keyframes shock{0%{transform:scale(1); opacity:1; stroke-width:3} 100%{transform:scale(3.4); opacity:0; stroke-width:.3}}
.burst #glint{animation:glintFast .6s ease-out}
@keyframes glintFast{from{transform:skewX(-18deg) translateX(0)} to{transform:skewX(-18deg) translateX(330px)}}

/* dégâts, soins, K.O. */
.card.hit{animation:hit .35s ease-out}
@keyframes hit{0%,100%{transform:translate(0,0)} 20%{transform:translate(-5px,2px)} 40%{transform:translate(4px,-2px)} 60%{transform:translate(-3px,1px)} 80%{transform:translate(2px,0)}}
#hitFlash{opacity:0; pointer-events:none}
.hit #hitFlash{animation:hitFlash .35s ease-out}
@keyframes hitFlash{0%{opacity:.45} 100%{opacity:0}}
#healGlow{opacity:0; transform-box:fill-box; transform-origin:center}
.healing #healGlow{animation:healGlow .9s ease-out}
@keyframes healGlow{0%{opacity:0; transform:scale(.8)} 25%{opacity:.9} 100%{opacity:0; transform:scale(1.25)}}
.popText{font-family:'JetBrains Mono',monospace; font-weight:800; font-size:16px; pointer-events:none; animation:popUp .9s ease-out forwards; paint-order:stroke; stroke-width:3px; stroke-linejoin:round}
@keyframes popUp{0%{transform:translateY(0); opacity:0} 15%{opacity:1} 100%{transform:translateY(-22px); opacity:0}}
#persoFloat{transition:filter .6s}
.card.ko #persoFloat{animation:none; filter:grayscale(1) brightness(.55)}
.card.ko .ring, .card.ko #aura, .card.ko #glint{animation:none; opacity:0}

@media (prefers-reduced-motion: reduce){
  .card *{animation:none !important}
  .booting .tilt,.booting .beam{animation:none}
}
</style>

<script>
// ===== Données des cartes (plus tard : tableur + sauvegarde du joueur) =====
const CARDS = {
  nicolas: { name:'NICOLAS', cls:'MYSTIQUE', rarity:'ÉPIQUE', style:'mystique', main:'#F72B2B', light:'#FF8888', level:12, xp:.45, stars:2 },
  cedric:  { name:'CEDRIC',  cls:'GARDIEN',  rarity:'ÉPIQUE', style:'gardien',  main:'#31B1FF', light:'#B0E5FF', level:18, xp:.7,  stars:1 },
};
const MAX_HP = 100, LEVEL_PER_STAR = 20;

const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = $('#stage'), tilt = $('#tilt');
let key = 'nicolas', C, svg, q, hp, token = 0;

// ---------- petites aides ----------
const attrs = (el, o) => { Object.entries(o).forEach(([k, v]) => el.setAttribute(k, v)); return el; };
const make = (tag, o) => attrs(document.createElementNS(NS, tag), o || {});
function retrigger(cls, ms){ svg.classList.remove(cls); void svg.getBoundingClientRect(); svg.classList.add(cls); setTimeout(() => svg && svg.classList.remove(cls), ms); }
const anims = new Map();
function animate(id, from, to, dur, delay, fn){
  const tok = (anims.get(id) || 0) + 1; anims.set(id, tok);
  setTimeout(() => {
    const t0 = performance.now();
    (function step(now){
      if(anims.get(id) !== tok) return;
      const p = dur ? Math.min(1, (now - t0) / dur) : 1, e = 1 - Math.pow(1 - p, 3);
      fn(from + (to - from) * e, p);
      if(p < 1) requestAnimationFrame(step);
    })(t0);
  }, delay || 0);
}

// ---------- montage d'une carte ----------
let barRect, ghostRect, shieldRect, xpArc, stars, BAR_X, BAR_W, shown = {bar:0, ghost:0, xp:0, hp:0, sh:0};
let shield = 0, shardsRect;
const MAX_SHIELD = 60;
// le bouclier suit la fin des PV ; s'il dépasse 100 %, il recouvre la fin de la partie rouge
function drawShield(){
  if(!shieldRect) return;
  const s = Math.max(0, shown.sh), start = Math.max(0, Math.min(shown.hp, MAX_HP - s));
  shieldRect.setAttribute('x', (BAR_X + BAR_W * start / MAX_HP).toFixed(2));
  shieldRect.setAttribute('width', (BAR_W * s / MAX_HP).toFixed(2));
}
function mount(k){
  key = k; C = CARDS[k]; token++; anims.clear();
  tilt.innerHTML = $('#tpl-' + k).innerHTML;
  svg = tilt.querySelector('svg'); svg.classList.add(C.style);
  q = s => svg.querySelector(s);
  document.documentElement.style.setProperty('--c', C.main);
  document.documentElement.style.setProperty('--cl', C.light);
  q('#tName').textContent = C.name; q('#tClass').textContent = C.cls; q('#tRarity').textContent = C.rarity;
  hp = MAX_HP;

  // anneau intérieur du cristal
  const ring = make('circle', {cx:232.62, cy:308.2, r:21.6, fill:'none', stroke:C.light, 'stroke-width':.4, 'stroke-dasharray':'6 2.5 1.2 2.5', opacity:.6});
  q('#crystalGroup').appendChild(ring); svg._ring = ring;

  // onde de choc au toucher
  const halo = q('.ring');
  const sc = halo ? {cx:halo.getAttribute('cx'), cy:halo.getAttribute('cy'), r:27.4} : {cx:304, cy:392, r:40};
  const shock = make('circle', {id:'shock', ...sc, fill:'none', stroke:C.light});
  const shockClip = make('g', {'clip-path':'url(#clipPanel)'}); shockClip.appendChild(shock);
  q('#persoFloat').insertBefore(shockClip, q('#persoImg'));

  // barre de vie : remplissage + segment fantôme
  barRect = q('#barFillRect'); BAR_X = +barRect.getAttribute('x'); BAR_W = +barRect.getAttribute('width');
  const gc = make('clipPath', {id:'clipGhost'}); ghostRect = make('rect', {x:BAR_X, y:524, width:BAR_W, height:11}); gc.appendChild(ghostRect);
  q('defs').appendChild(gc);
  const ghost = make('polygon', {points:q('#Barre_de_vie polygon').getAttribute('points'), fill:'#ffd6d6', opacity:.8, 'clip-path':'url(#clipGhost)'});
  q('#Barre_de_vie').before(ghost); svg._ghost = ghost;

  // bouclier : segment blanc qui se superpose à la fin de la barre de vie
  const sc2 = make('clipPath', {id:'clipShield'}); shieldRect = make('rect', {x:BAR_X, y:524, width:0, height:11}); sc2.appendChild(shieldRect);
  q('defs').appendChild(sc2);
  const pts = q('#Barre_de_vie polygon').getAttribute('points');
  const sb = make('g', {id:'shieldBar', 'clip-path':'url(#clipShield)'});
  sb.appendChild(make('polygon', {points:pts, fill:'#ffffff', opacity:.93}));
  sb.appendChild(make('polygon', {points:pts, fill:'none', stroke:C.light, 'stroke-width':.5}));
  q('#fxBar').before(sb);
  const sc3 = make('clipPath', {id:'clipShards'}); shardsRect = make('rect', {x:BAR_X, y:524, width:0, height:11}); sc3.appendChild(shardsRect);
  q('defs').appendChild(sc3);
  const shards = make('g', {id:'shieldShards', 'clip-path':'url(#clipShards)', style:'transform-box:fill-box;transform-origin:center'});
  shards.appendChild(make('polygon', {points:pts, fill:'#ffffff', opacity:.6}));
  q('#fxBar').before(shards);
  shield = 0; shown.hp = hp; shown.sh = 0; drawShield();

  // flash de dégâts, halo de soin
  const flash = make('path', {id:'hitFlash', d:q('#clipCard path').getAttribute('d'), fill:'#ff1e1e'}); q('#fxFoil').before(flash);
  q('#persoFloat').appendChild(make('circle', {id:'healGlow', cx:300, cy:395, r:62, fill:'none', stroke:'#6dffb0', 'stroke-width':2.2}));

  xpArc = q('#xpArc');
  stars = [0,1,2,3,4].map(i => q('#star' + i));
  render(true);
  boot();
}

// ---------- affichage des valeurs ----------
const capOf = () => Math.min(100, C.stars * LEVEL_PER_STAR);
function setXp(v){ shown.xp = v; xpArc.setAttribute('stroke-dasharray', `${Math.max(0, v).toFixed(4)} 1`); }
function setBar(rect, v){ rect.setAttribute('width', (BAR_W * v / MAX_HP).toFixed(2)); }
function render(){
  q('#tLvl').textContent = C.level >= 100 ? 'MAX' : C.level;
  q('#tLvl').setAttribute('font-size', C.level >= 100 ? 3.6 : C.level >= 10 ? 5.2 : 5.6);
  stars.forEach((s, i) => s.style.opacity = i < C.stars ? 1 : 0);
  updateUI();
}
function updateUI(){
  $('#dmgBtn').disabled = hp <= 0;
  $('#healBtn').disabled = hp >= MAX_HP;
  $('#starBtn').disabled = C.stars >= 5;
  $('#shieldBtn').disabled = hp <= 0 || shield >= MAX_SHIELD;
  const atCap = C.level >= capOf();
  $('#xpBtn').disabled = atCap;
  svg.classList.toggle('ko', hp <= 0);
  $('#status').innerHTML = C.level >= 100
    ? `<b>Niveau maximum</b> atteint.`
    : atCap
      ? `Niveau <b>${C.level}</b>, plafond de ${C.stars} étoile${C.stars > 1 ? 's' : ''} atteint. Rescanne le cast pour continuer.`
      : `Niveau <b>${C.level}</b> sur ${capOf()} possibles avec ${C.stars} étoile${C.stars > 1 ? 's' : ''}.`;
}

// ---------- apparition ----------
function boot(){
  const tok = token;
  if(reduce){ setBar(barRect, hp); setBar(ghostRect, hp); setXp(C.xp); q('#tHp').textContent = hp + ' %'; return; }
  stage.classList.remove('booting'); void stage.offsetWidth; stage.classList.add('booting');
  setBar(barRect, 0); setBar(ghostRect, 0); setXp(0); q('#tHp').textContent = '0 %';
  const lines = [...svg.querySelectorAll('.cline')];
  lines.forEach(l => { l.style.transition = 'none'; l.style.strokeDashoffset = 1; });
  q('#tName').textContent = '';
  svg._boost = 1;
  setTimeout(() => tok === token && lines.forEach((l, i) => { l.style.transition = `stroke-dashoffset .7s ease-out ${i * .035}s`; l.style.strokeDashoffset = 0; }), 700);
  setTimeout(() => tok === token && scramble(q('#tName'), C.name, 900, tok), 900);
  animate('bar', 0, hp, 1100, 1100, v => { setBar(barRect, v); setBar(ghostRect, v); shown.hp = v; drawShield(); q('#tHp').textContent = Math.round(v) + ' %'; });
  animate('xp', 0, C.xp, 900, 1500, setXp);
  stars.forEach((s, i) => { if(i < C.stars){ s.style.opacity = 0; setTimeout(() => { if(tok !== token) return; s.style.opacity = 1; s.classList.remove('starPop'); void s.getBoundingClientRect(); s.classList.add('starPop'); }, 1700 + i * 140); } });
}
function scramble(el, text, dur, tok){
  const chars = 'ABCDEFGHJKLMNPRSTVXZ0123456789#/<>', t0 = performance.now();
  (function step(now){
    if(tok !== token) return;
    const p = Math.min(1, (now - t0) / dur), fixed = Math.floor(p * text.length);
    let s = text.slice(0, fixed);
    for(let i = fixed; i < text.length; i++) s += chars[Math.floor(Math.random() * chars.length)];
    el.textContent = s;
    if(p < 1) requestAnimationFrame(step); else el.textContent = text;
  })(t0);
}

// ---------- actions ----------
function popText(txt, fill, stroke){
  const t = make('text', {x:300 + (Math.random() * 30 - 15), y:455, 'text-anchor':'middle', class:'popText', fill, stroke});
  t.textContent = txt; svg.appendChild(t); setTimeout(() => t.remove(), 950);
}
function damage(){
  if(hp <= 0) return;
  const amt = 12 + Math.floor(Math.random() * 13);
  // le bouclier encaisse en premier, le reste passe sur les PV
  const absorbed = Math.min(shield, amt), rest = Math.min(hp, amt - absorbed);
  const sFrom = shield; shield -= absorbed;
  if(absorbed){
    if(shield <= 0){ shardsRect.setAttribute('x', shieldRect.getAttribute('x')); shardsRect.setAttribute('width', shieldRect.getAttribute('width')); retrigger('shieldBreak', 650); }
    animate('sh', sFrom, shield, 220, 0, v => { shown.sh = v; drawShield(); });
  }
  if(rest > 0){
    const from = hp; hp -= rest;
    svg._ghost.setAttribute('fill', '#ffd6d6');
    animate('bar', from, hp, 220, absorbed ? 140 : 0, v => { setBar(barRect, v); shown.hp = v; drawShield(); q('#tHp').textContent = Math.round(v) + ' %'; });
    animate('ghost', from, hp, 550, 420, v => setBar(ghostRect, v));
    popText('−' + rest, '#ffffff', '#8a0000');
  } else {
    popText('−' + absorbed, '#ffffff', '#5a6472');   // coup entièrement absorbé
  }
  retrigger('hit', 380); updateUI();
}
function heal(){
  if(hp >= MAX_HP) return;
  const amt = Math.min(MAX_HP - hp, 15 + Math.floor(Math.random() * 11)), from = hp; hp += amt;
  svg._ghost.setAttribute('fill', '#7dffb8'); setBar(ghostRect, hp);
  animate('bar', from, hp, 650, 150, v => { setBar(barRect, v); shown.hp = v; drawShield(); q('#tHp').textContent = Math.round(v) + ' %'; });
  retrigger('healing', 950); popText('+' + amt, '#d4ffe6', '#0d5a32'); updateUI();
}
function addShield(){
  if(hp <= 0 || shield >= MAX_SHIELD) return;
  const from = shield; shield = Math.min(MAX_SHIELD, shield + 20);
  animate('sh', from, shield, 450, 0, v => { shown.sh = v; drawShield(); });
  retrigger('shieldUp', 650); updateUI();
}
function gainXp(){
  if(C.level >= capOf()) return;
  const gain = .35, target = C.xp + gain;
  popText('+XP', '#d9ffdb', '#1f5a24');
  if(target < 1){ animate('xp', C.xp, target, 600, 0, setXp); C.xp = target; return; }
  // le cercle se remplit, le niveau monte, le reste repart de zéro
  const rest = target - 1;
  animate('xp', C.xp, 1, 450, 0, (v, p) => {
    setXp(v);
    if(p >= 1){
      C.level++; C.xp = C.level >= capOf() ? 1 : rest;
      retrigger('lvlUp', 750); render();
      popText('NIVEAU ' + C.level, '#ffffff', '#1f5a24');
      if(C.level < capOf()) animate('xp', 0, C.xp, 500, 250, setXp);
    }
  });
}
function rescan(){
  if(C.stars >= 5) return;
  C.stars++;
  const s = stars[C.stars - 1];
  s.style.opacity = 1; s.classList.remove('starPop'); void s.getBoundingClientRect(); s.classList.add('starPop');
  retrigger('burst', 950); svg._boost = 1;
  if(C.level < capOf() && shown.xp >= 1){ C.xp = 0; setXp(0); }
  popText('★ ' + C.stars, '#fff3c4', '#6b4b00');
  render();
}
$('#dmgBtn').onclick = damage;
$('#healBtn').onclick = heal;
$('#xpBtn').onclick = gainXp;
$('#starBtn').onclick = rescan;
$('#shieldBtn').onclick = addShield;
$('#replay').onclick = () => { hp = MAX_HP; shield = 0; shown.sh = 0; anims.clear(); token++; drawShield(); render(); boot(); };

// ---------- bascule entre les cartes ----------
const sw = $('#switch');
Object.entries(CARDS).forEach(([k, c]) => {
  const b = document.createElement('button');
  b.innerHTML = `<span class="dot" style="--d:${c.main}"></span>${c.name.charAt(0) + c.name.slice(1).toLowerCase()}`;
  b.onclick = () => { if(k === key) return; sw.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); mount(k); };
  if(k === key) b.classList.add('on');
  sw.appendChild(b);
});

// ---------- inclinaison 3D, reflet, toucher ----------
let tx = 0, ty = 0, gx = 0, gy = 0, active = false, downX = 0, downY = 0, moved = false, lastT = performance.now(), spin = 0;
function setTarget(e){ const r = stage.getBoundingClientRect(); gx = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width) * 2 - 1)); gy = Math.max(-1, Math.min(1, ((e.clientY - r.top) / r.height) * 2 - 1)); }
stage.addEventListener('pointerdown', e => { active = true; downX = e.clientX; downY = e.clientY; moved = false; setTarget(e); stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove', e => { if(e.pointerType === 'mouse' || active){ active = true; setTarget(e); if(Math.hypot(e.clientX - downX, e.clientY - downY) > 8) moved = true; } });
stage.addEventListener('pointerup', e => { if(!moved){ retrigger('burst', 950); svg._boost = 1; } if(e.pointerType !== 'mouse') active = false; });
stage.addEventListener('pointerleave', () => active = false);
stage.addEventListener('pointercancel', () => active = false);

function loop(now){
  const dt = Math.min(50, now - lastT); lastT = now;
  const txT = active ? gx : (reduce ? 0 : Math.sin(now / 2600) * .35), tyT = active ? gy : (reduce ? 0 : Math.cos(now / 3400) * .22);
  const k = 1 - Math.pow(.0015, dt / 1000);
  tx += (txT - tx) * k; ty += (tyT - ty) * k;
  tilt.style.transform = `rotateY(${tx * 14}deg) rotateX(${-ty * 14}deg)`;
  if(svg){
    svg.style.setProperty('--tx', tx.toFixed(3)); svg.style.setProperty('--ty', ty.toFixed(3));
    const foil = q('#gFoil'), o = tx * 90 + ty * 60;
    if(foil) attrs(foil, {x1:150 + o, y1:250 + o * .6, x2:450 + o, y2:590 + o * .6});
    if(!reduce && svg._ring){
      spin = (spin + dt * (.025 + (svg._boost || 0) * .6)) % 360;
      svg._boost = Math.max(0, (svg._boost || 0) - dt / 1400);
      svg._ring.setAttribute('transform', `rotate(${spin.toFixed(2)} 232.62 308.2)`);
    }
  }
  requestAnimationFrame(loop);
}

(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { mount(key); requestAnimationFrame(loop); });
</script>
